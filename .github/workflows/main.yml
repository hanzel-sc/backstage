name: Backstage Security Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:

  codeql-analysis:
    name: CodeQL Static Analysis
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Build Backstage
        run: yarn tsc

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >
            p/javascript
            p/typescript
            p/nodejs
            p/docker
            p/kubernetes
            p/terraform
            p/secrets

  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-filesystem:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          format: table

  trivy-config:
    name: Trivy IaC Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Scan Terraform, Helm, Kubernetes
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM
          format: table

  sbom-generation:
    name: SBOM Generation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM
        run: |
          syft dir:. -o cyclonedx-json > sbom.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backstage-sbom
          path: sbom.json

  grype-vulnerability-scan:
    name: Grype Vulnerability Scan
    runs-on: ubuntu-latest
    needs: sbom-generation

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: backstage-sbom

      - name: Install Grype
        uses: anchore/scan-action/download-grype@v3

      - name: Run Grype Scan
        run: |
          grype sbom:sbom.json --fail-on high

  docker-security-scan:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backstage Docker Image
        run: |
          docker build \
            -f packages/backend/Dockerfile \
            -t backstage-security-scan:latest .

      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: backstage-security-scan:latest
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  dependency-audit:
    name: Yarn Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Run Yarn Audit
        run: yarn npm audit --severity high || true

  license-scan:
    name: OSS License Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Generate License Report
        run: |
          npx license-checker \
            --production \
            --summary

  security-summary:
    name: Security Pipeline Summary
    runs-on: ubuntu-latest
    needs:
      - codeql-analysis
      - semgrep
      - gitleaks
      - trivy-filesystem
      - trivy-config
      - grype-vulnerability-scan
      - docker-security-scan
      - dependency-audit
      - license-scan

    steps:
      - name: Security Validation Complete
        run: |
          echo "======================================="
          echo "Backstage Security Validation Complete"
          echo "======================================="
          echo ""
          echo "Scans Executed:"
          echo "- CodeQL"
          echo "- Semgrep"
          echo "- Gitleaks"
          echo "- Trivy Filesystem"
          echo "- Trivy IaC"
          echo "- SBOM Generation"
          echo "- Grype Vulnerability Scan"
          echo "- Docker Image Scan"
          echo "- Dependency Audit"
          echo "- License Scan"
